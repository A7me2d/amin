<div class="flex min-h-screen bg-theme text-theme" dir="rtl">
  <!-- Mobile Overlay -->
  @if (sidebarOpen()) {
    <div class="fixed inset-0 bg-black/50 z-40 lg:hidden" (click)="closeSidebar()"></div>
  }
  
  <!-- Sidebar -->
  <aside class="fixed lg:relative z-50 w-64 h-full bg-theme-secondary border-l border-theme flex flex-col transform transition-transform duration-300 lg:translate-x-0"
         [class.translate-x-full]="!sidebarOpen()">
    <div class="p-6 border-b border-theme">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-xl font-bold text-primary">نظام الإجارة</h1>
          <p class="text-theme-secondary text-sm mt-1">إدارة العقارات</p>
        </div>
        
        <!-- Close Button (Mobile) -->
        <button (click)="closeSidebar()" class="lg:hidden p-2 rounded-lg hover:bg-theme transition-colors">
          <svg class="w-5 h-5 text-theme-secondary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
        
        <!-- Theme Selector -->
        <div class="theme-dropdown">
          <button (click)="toggleThemeMenu()" 
                  class="p-2 rounded-lg bg-theme hover:bg-opacity-80 transition-colors border border-theme"
                  [class.border-primary]="themeMenuOpen()">
            <svg class="w-5 h-5 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"/>
            </svg>
          </button>
          
          @if (themeMenuOpen()) {
            <div class="theme-dropdown-menu open">
              @for (theme of themeService.themes; track theme.name) {
                <div class="theme-dropdown-item" 
                     [class.active]="currentThemeName() === theme.name"
                     (click)="selectTheme(theme.name)">
                  <span class="theme-color-dot" [style.background-color]="theme.primaryColor"></span>
                  <span class="text-theme">{{ theme.label }}</span>
                  @if (currentThemeName() === theme.name) {
                    <svg class="w-4 h-4 text-primary mr-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                    </svg>
                  }
                </div>
              }
            </div>
          }
        </div>
      </div>
    </div>
    
    <nav class="flex-1 p-4">
      <a routerLink="/" 
         routerLinkActive="bg-primary/20 text-primary border-primary"
         [routerLinkActiveOptions]="{exact: true}"
         (click)="closeSidebar()"
         class="flex items-center gap-3 px-4 py-3 rounded-lg text-theme-secondary hover:bg-theme transition-colors border-r-4 border-transparent mb-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
        </svg>
        <span>الرئيسية</span>
      </a>
      
      <a routerLink="/units" 
         routerLinkActive="bg-primary/20 text-primary border-primary"
         (click)="closeSidebar()"
         class="flex items-center gap-3 px-4 py-3 rounded-lg text-theme-secondary hover:bg-theme transition-colors border-r-4 border-transparent mb-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
        </svg>
        <span>الوحدات</span>
      </a>
      
      <a routerLink="/contracts" 
         routerLinkActive="bg-primary/20 text-primary border-primary"
         (click)="closeSidebar()"
         class="flex items-center gap-3 px-4 py-3 rounded-lg text-theme-secondary hover:bg-theme transition-colors border-r-4 border-transparent">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
        </svg>
        <span>العقود</span>
      </a>
    </nav>
    
    <div class="p-4 border-t border-theme">
      <p class="text-theme-secondary text-xs text-center"> 2026 نظام الإجارة</p>
    </div>
  </aside>
  
  <!-- Main Content -->
  <main class="flex-1 overflow-auto">
    <!-- Mobile Header -->
    <div class="lg:hidden sticky top-0 z-30 bg-theme-secondary border-b border-theme p-4 flex items-center justify-between">
      <button (click)="openSidebar()" class="p-2 rounded-lg hover:bg-theme transition-colors">
        <svg class="w-6 h-6 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
      <h1 class="text-lg font-bold text-primary">نظام الإجارة</h1>
      <div class="w-10"></div>
    </div>
    
    <router-outlet></router-outlet>
  </main>
</div>
